openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: openai
    description: AI-assisted order and supplier-message tools
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /openai/generate-charge-message:
    post:
      operationId: generateChargeMessage
      tags: [openai]
      summary: Draft a supplier message from pre-calculated invoice differences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChargeMessageInput"
      responses:
        "200":
          description: Generated WhatsApp-style supplier message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargeMessageResult"
        "400":
          description: Invalid message facts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargeMessageError"
        "502":
          description: AI text generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargeMessageError"
  /openai/extract-order-items:
    post:
      operationId: extractOrderItems
      tags: [openai]
      summary: Extract draft order items from pasted WhatsApp text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppOrderTextInput"
      responses:
        "200":
          description: Draft items extracted for user review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractedOrderItems"
        "400":
          description: Invalid pasted text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargeMessageError"
        "502":
          description: AI extraction failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargeMessageError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ChargeMessageInput:
      type: object
      additionalProperties: false
      properties:
        invoiceNumber:
          type: string
          minLength: 1
          maxLength: 40
        totalAmount:
          type: string
          minLength: 1
          maxLength: 40
        partial:
          type: boolean
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/ChargeMessageItem"
      required:
        - invoiceNumber
        - totalAmount
        - partial
        - items
    ChargeMessageItem:
      type: object
      additionalProperties: false
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 500
        kind:
          type: string
          enum: [matched, notInOrder]
        itemAmount:
          type: string
          minLength: 1
          maxLength: 40
        quantityDifference:
          type: ["string", "null"]
          maxLength: 60
        priceDifference:
          type: ["string", "null"]
          maxLength: 60
      required:
        - description
        - kind
        - itemAmount
        - quantityDifference
        - priceDifference
    ChargeMessageResult:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    ChargeMessageError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    WhatsAppOrderTextInput:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 12000
      required:
        - text
    ExtractedOrderItems:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ExtractedOrderItem"
      required:
        - items
    ExtractedOrderItem:
      type: object
      additionalProperties: false
      properties:
        descricao:
          type: string
          minLength: 1
          maxLength: 500
        quantidade:
          type: ["string", "null"]
          maxLength: 50
        unidade:
          type: ["string", "null"]
          maxLength: 40
        precoUnitario:
          type: ["string", "null"]
          maxLength: 50
      required:
        - descricao
        - quantidade
        - unidade
        - precoUnitario

