kind = "web"
previewPath = "/"
title = "Confere"
description = "Aplicativo em português para pequenos comércios lerem XML de NF-e, registrarem pedidos e conferirem divergências. A IA prepara mensagens de cobrança usando valores já calculados pelo app; pedido e nota não ficam armazenados no servidor."
version = "1.0.0"
id = "artifacts/confere"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19385

[services.development]
run = "pnpm --filter @workspace/confere run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/confere", "run", "build" ]
serve = "static"
publicDir = "artifacts/confere/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19385"
BASE_PATH = "/"
