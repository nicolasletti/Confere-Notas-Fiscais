kind = "web"
previewPath = "/"
title = "Confere"
description = "Aplicativo em português para pequenos comércios registrarem pedidos, extrair itens de mensagens do WhatsApp com IA para revisão, ler XML de NF-e e conferir divergências. A IA não calcula valores e os itens só são salvos no pedido após confirmação."
version = "1.0.0"
id = "artifacts/confere"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19385

[services.development]
run = "pnpm --filter @workspace/confere run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/confere", "run", "build" ]
serve = "static"
publicDir = "artifacts/confere/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19385"
BASE_PATH = "/"
